name: Deploy API to Hugging Face

# Pushes backend/ (Dockerfile + README with Space settings) to a Hugging Face Space,
# which then builds and runs it. Needs, in GitHub repo settings:
#   secret   HF_TOKEN  - Hugging Face access token with write access
#   variable HF_SPACE  - e.g. your-username/documind-api
# Without them this workflow does nothing.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-hf.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # subtree split needs the full history
      - name: Push backend/ to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          git subtree split --prefix backend -b space
          # --force: the Space repo starts with Hugging Face's own initial commit.
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
      - name: Explain missing setup
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "::notice::Set the HF_TOKEN secret and HF_SPACE variable to deploy to Hugging Face."
