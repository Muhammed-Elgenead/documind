[project]
name = "documind-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.2",
    "fastapi>=0.162.6",
    "fastembed>=0.9.1",
    "google-genai>=3.3.0",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.10",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
